
services:

  redis:
    image: redis:7-alpine
    container_name: redis-test
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: flask-api-test
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_VERSION: "1.0.0"

    depends_on:
      redis:
        condition: service_healthy
