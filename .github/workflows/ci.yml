
name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1 : CODE QUALITY
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Analyse code with Ruff
        run: |
          ruff check .
          ruff format --check .


  # JOB 2 : UNIT TESTS
  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests with pytest
        run: python -m pytest -v


  # JOB 3 : DOCKER BUILD
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: docker-flask-redis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: docker image inspect docker-flask-redis:${{ github.sha }}

      - name: Export Docker image
        run: |
          docker save docker-flask-redis:${{ github.sha }} -o docker-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 1


  # JOB 4 : SECURITY SCAN
  security:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Load Docker image
        run: docker load -i docker-image.tar

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: ${{ github.workspace }}/docker-image.tar
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'


  # JOB 5 : PUBLISH TO GHCR
  publish:
    needs: security
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: Load Docker image
        run: docker load -i docker-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker image
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag docker-flask-redis:${GITHUB_SHA} \
            ${IMAGE_NAME}:${GITHUB_SHA}

          docker push ${IMAGE_NAME}:${GITHUB_SHA}

          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            docker tag ${IMAGE_NAME}:${GITHUB_SHA} ${IMAGE_NAME}:dev
            docker push ${IMAGE_NAME}:dev
          fi


  # JOB 6 : DEPLOY TO TEST ENVIRONMENT
  deploy:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    environment:
      name: test

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Define Docker image
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy application
        run: |
          docker compose -f compose.deploy.yaml up -d --pull always --wait --wait-timeout 60

      - name: Check containers
        run: |
          docker compose -f compose.deploy.yaml ps

      - name: Smoke test API
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:5000/health)

          echo "$response"

          echo "$response" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'

      - name: Debug deployment failure
        if: failure()
        run: |
          echo "===== CONTAINER STATUS ====="
          docker compose -f compose.deploy.yaml ps -a

          echo "===== FLASK CONTAINER INSPECTION ====="
          docker inspect flask-api-test \
            --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} RestartCount={{.RestartCount}}'

          echo "===== FLASK APPLICATION LOGS ====="
          docker compose -f compose.deploy.yaml logs --tail=200 app

          echo "===== REDIS LOGS ====="
          docker compose -f compose.deploy.yaml logs --tail=100 redis

      - name: Cleanup test environment
        if: always()
        run: docker compose -f compose.deploy.yaml down -v
